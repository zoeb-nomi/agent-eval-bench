[project]
name = "evalbench"
version = "0.1.0"
description = "Agent eval bench: LangGraph support agent, guardrails, 50-persona client simulation, tracing, judge eval with calibrated rubric."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langfuse>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evalbench = ["data/*.yaml"]
